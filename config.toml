# The base URL of the site; the only required configuration variable.
base_url = "https://suresh.dev"
theme = "apollo"

title = "Suresh"
description = "Backend Developer | OSS | Java | Kotlin Multiplatform | OpenJDK | GraalVM | Agentic AI"
default_language = "en"

compile_sass = true
minify_html = true
build_search_index = true
generate_feeds = true
generate_sitemap = true
generate_robots_txt = true

taxonomies = [
    { name = "tags", feed = true },
]

[markdown]
smart_punctuation = true
external_links_target_blank = true

[markdown.highlighting]
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[search]
include_title = true
include_description = true
include_path = true
include_content = true
index_format = "elasticlunr_json"

[extra]
theme = "toggle"          # light, dark, auto, toggle, toggle-auto
favicon = "/favicon.ico"
toc = true
fancy_code = true
dynamic_note = true

menu = [
    { name = "Notes", url = "/notes" },
    { name = "Blog", url = "/blog" },
    { name = "Tags", url = "/tags" },
]

socials = [
    { name = "github", url = "https://github.suresh.dev", icon = "github" },
    { name = "bluesky", url = "https://bsky.app/profile/suresh.dev", icon = "bluesky" },
    { name = "x", url = "https://twitter.suresh.dev", icon = "x-twitter" },
    { name = "rss", url = "/atom.xml", icon = "rss" },
]

[extra.analytics]
enabled = false
