<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>hn/search — Hacker News search</title>
    <link rel="icon"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231B1E24'/%3E%3Cpath d='M27 12a15 15 0 1 0 10.6 25.6L49 49' fill='none' stroke='%2372C69A' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
          rel="stylesheet">
    <style>
        :root {
            --paper: #F3F4F6;
            --paper-raised: #FFFFFF;
            --ink: #1B1E24;
            --muted: #676C78;
            --line: #E2E4E8;
            --accent: #3654D9;
            --run-accent: #72C69A;
            --run-accent-hover: #8BD7AA;
            --error-bg: #FDECEA;
            --error-line: #F3B9AC;
            --error-text: #92341C;
            --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
            --sans: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--sans);
            line-height: 1.45;
        }

        .wrap {
            max-width: 820px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }

        .site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
        }

        .brand, .hn-home {
            font-family: var(--mono);
            font-size: 13px;
            letter-spacing: .04em;
            color: var(--muted);
            text-decoration: none;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .brand-icon {
            width: 17px;
            height: 17px;
            fill: var(--run-accent);
            flex: none;
        }

        .brand:hover, .hn-home:hover {
            color: var(--ink);
        }

        .hn-home {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            letter-spacing: 0;
        }

        .brand b {
            color: var(--ink);
        }

        /* --- search bar --- */
        form.bar {
            font-family: var(--mono);
            font-size: 13.5px;
            background: var(--ink);
            color: var(--paper);
            border-radius: 4px;
            padding: 14px 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 6px;
        }

        .bar-option {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            min-width: 0;
            white-space: nowrap;
        }

        .terms-option {
            flex: 1 1 300px;
        }

        .bar .sym {
            color: var(--run-accent);
        }

        .bar .flag {
            color: #8B90A0;
        }

        .bar input[type=text] {
            background: transparent;
            border: none;
            border-bottom: 1px solid #363B4A;
            color: var(--paper);
            font-family: var(--mono);
            font-size: 13.5px;
            padding: 3px 2px;
            width: 280px;
            max-width: 60vw;
            min-width: 0;
        }

        .bar input[type=text]:focus {
            outline: none;
            border-color: var(--accent);
        }

        .bar select {
            appearance: none;
            background: transparent;
            border: 1px solid #363B4A;
            color: var(--paper);
            font-family: var(--mono);
            font-size: 13px;
            padding: 3px 7px;
            border-radius: 2px;
        }

        .bar select:focus-visible, .bar input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        .bar button {
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 500;
            background: var(--run-accent);
            color: var(--ink);
            border: none;
            border-radius: 2px;
            padding: 6px 12px;
            cursor: pointer;
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .bar button:hover {
            background: var(--run-accent-hover);
        }

        .run-icon {
            width: 13px;
            height: 13px;
            fill: currentColor;
        }

        .bar button:focus-visible {
            outline: 2px solid var(--paper);
            outline-offset: 2px;
        }

        .bar button[disabled] {
            opacity: .5;
            cursor: default;
        }

        /* --- presets --- */
        .presets {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .presets .label {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted);
            margin-right: 2px;
        }

        .presets button {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--ink);
            background: var(--paper-raised);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 5px 12px;
            cursor: pointer;
        }

        .presets button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .presets button.active {
            background: var(--ink);
            color: var(--paper);
            border-color: var(--ink);
        }

        .presets button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }

        .hint {
            font-family: var(--mono);
            font-size: 11.5px;
            color: var(--muted);
            margin: 14px 2px 0;
        }

        /* --- legend --- */
        .legend {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin: 18px 2px 4px;
            font-family: var(--mono);
            font-size: 12.5px;
        }

        .legend button {
            display: flex;
            align-items: center;
            gap: 7px;
            background: none;
            border: none;
            cursor: pointer;
            font-family: var(--mono);
            font-size: 12.5px;
            color: var(--ink);
            padding: 4px 2px;
        }

        .legend .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
        }

        .legend button.off {
            color: var(--muted);
        }

        .legend button.off .dot {
            background: transparent !important;
            border: 1.5px solid var(--muted);
        }

        .legend button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* --- error banner --- */
        .banner {
            display: none;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            background: var(--error-bg);
            border: 1px solid var(--error-line);
            border-radius: 4px;
            padding: 11px 14px;
            margin: 16px 2px 0;
            font-family: var(--mono);
            font-size: 12.5px;
            color: var(--error-text);
        }

        .banner.show {
            display: flex;
        }

        .banner button {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--error-text);
            background: transparent;
            border: 1px solid var(--error-line);
            border-radius: 3px;
            padding: 4px 10px;
            cursor: pointer;
            margin-left: auto;
        }

        .banner button:hover {
            background: var(--error-line);
        }

        .stats {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--muted);
            margin: 16px 2px 22px;
            min-height: 16px;
        }

        /* --- results --- */
        .list {
            border-top: 1px solid var(--line);
        }

        details.row {
            border-bottom: 1px solid var(--line);
        }

        details.row summary {
            list-style: none;
            cursor: pointer;
            display: flex;
            gap: 10px;
            padding: 14px 4px;
            align-items: flex-start;
        }

        details.row summary::-webkit-details-marker {
            display: none;
        }

        details.row summary:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        details.row summary:hover {
            background: var(--paper-raised);
        }

        .row-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-top: 7px;
            flex: none;
        }

        .row-body {
            min-width: 0;
            flex: 1;
        }

        .title-line {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }

        a.storylink {
            color: var(--ink);
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
        }

        a.storylink:hover {
            text-decoration: underline;
        }

        .kind {
            font-family: var(--mono);
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--muted);
        }

        .domain {
            font-family: var(--mono);
            font-size: 11.5px;
            color: var(--muted);
        }

        .snippet {
            font-size: 13px;
            color: #3C3F46;
            margin-top: 4px;
        }

        .meta {
            font-family: var(--mono);
            font-size: 11.5px;
            color: var(--muted);
            margin-top: 6px;
        }

        .meta a {
            color: var(--muted);
        }

        .meta a:hover {
            color: var(--ink);
        }

        .meta .sep {
            margin: 0 6px;
            color: var(--line);
        }

        .expand-caret {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--muted);
            flex: none;
            margin-top: 8px;
        }

        details.row[open] .expand-caret {
            color: var(--accent);
        }

        .comments {
            padding: 4px 4px 20px 26px;
        }

        .comments .loading, .comments .empty {
            font-family: var(--mono);
            font-size: 12.5px;
            color: var(--muted);
        }

        .comment {
            padding: 10px 0;
            border-top: 1px dashed var(--line);
        }

        .comment:first-child {
            border-top: none;
        }

        .comment .cauthor {
            font-family: var(--mono);
            font-size: 11.5px;
            color: var(--ink);
            margin-bottom: 3px;
        }

        .comment .ctext {
            font-size: 13.5px;
        }

        .viewall {
            display: inline-block;
            margin-top: 10px;
            font-family: var(--mono);
            font-size: 12px;
            color: var(--muted);
        }

        footer {
            margin-top: 36px;
            font-family: var(--mono);
            font-size: 11.5px;
            color: var(--muted);
        }

        footer a {
            color: var(--muted);
        }

        @media (max-width: 700px) {
            .wrap {
                padding: 28px 16px 56px;
            }

            form.bar {
                align-items: stretch;
            }

            .terms-option {
                flex-basis: 100%;
            }

            .bar input[type=text] {
                flex: 1;
                width: auto;
                max-width: none;
            }

            .bar button {
                margin-left: 0;
            }
        }

        @media (max-width: 420px) {
            form.bar {
                gap: 8px 4px;
                padding: 12px;
            }

            .bar-option:not(.terms-option) {
                flex: 1 1 100%;
            }

            .bar select {
                min-height: 32px;
                max-width: 100%;
            }

            .bar button {
                flex: 1 1 100%;
                min-height: 34px;
            }

            .site-header {
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
<div class="wrap">

    <header class="site-header">
        <a class="brand" href="./" aria-label="hn/search home">
            <svg class="brand-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                <path d="M8.2 2.8a5.4 5.4 0 1 0 3.8 9.2l3.5 3.5 1.1-1.1-3.5-3.5a5.4 5.4 0 0 0-4.9-8.1Zm0 1.6a3.8 3.8 0 1 1 0 7.6 3.8 3.8 0 0 1 0-7.6Z"/>
            </svg>
            <span><b>hn</b>/search</span>
        </a>
        <a class="hn-home" href="https://news.ycombinator.com/" target="_blank" rel="noopener">Hacker News <span
                aria-hidden="true">↗</span></a>
    </header>

    <form class="bar" id="bar">
        <span class="sym">$</span>
        <span class="bar-option terms-option"><span class="flag">--terms=</span><input type="text" id="terms"
                                                                                       value="java, jvm, openjdk"
                                                                                       aria-label="search terms, comma separated"></span>
        <span class="bar-option"><span class="flag">--type=</span><select id="type" aria-label="result type">
        <option value="all">all</option>
        <option value="story" selected>stories</option>
        <option value="comment">comments</option>
        <option value="job">jobs</option>
        <option value="poll">polls</option>
    </select></span>
        <span class="bar-option"><span class="flag">--since=</span><select id="since" aria-label="date range">
        <option value="7">7d</option>
        <option value="30" selected>30d</option>
        <option value="90">90d</option>
        <option value="365">365d</option>
        <option value="0">all</option>
    </select></span>
        <span class="bar-option"><span class="flag">--sort=</span><select id="sortby" aria-label="sort by">
        <option value="points" selected>points</option>
        <option value="comments">comments</option>
        <option value="date">recent</option>
    </select></span>
        <button type="submit" id="run"><span>run</span>
            <svg class="run-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <path d="M5.25 3.25a.75.75 0 0 0-1.14.64v8.22a.75.75 0 0 0 1.14.64l6.1-4.11a.78.78 0 0 0 0-1.28l-6.1-4.11Z"/>
            </svg>
        </button>
    </form>

    <div class="presets" id="presets">
        <span class="label">presets:</span>
    </div>
    <div class="hint">comma-separate multiple terms · "all" type mixes in comments, jobs and polls, not just stories ·
        URL is shareable
    </div>

    <div class="legend" id="legend"></div>
    <div class="banner" id="banner" role="alert">
        <span id="bannerMsg"></span>
        <button type="button" id="retry">retry</button>
    </div>
    <div class="stats" id="stats" aria-live="polite">ready.</div>

    <div class="list" id="list"></div>

    <footer>
        data via <a href="https://hn.algolia.com" target="_blank" rel="noopener">HN Search (Algolia)</a>
    </footer>

</div>

<script>
    // Known ecosystem terms get a deliberate, on-brand color. Anything else
    // falls back to a rotating palette, assigned in first-seen order.
    const TERM_COLORS = {java: '#B5502C', jvm: '#2F7A63', openjdk: '#3B5A8C', kotlin: '#6E4FB8'};
    const FALLBACK_PALETTE = ['#9C7A1E', '#B23A5E', '#3C7A9C', '#6B8C3A'];
    const PRESETS = ['java', 'jvm', 'openjdk', 'kotlin', 'java, jvm, openjdk', 'java, jvm, openjdk, kotlin'];
    const VALID_TYPES = new Set(['all', 'story', 'comment', 'job', 'poll']);
    const VALID_RANGES = new Set(['7', '30', '90', '365', '0']);
    const VALID_SORTS = new Set(['points', 'comments', 'date']);

    const $ = (id) => document.getElementById(id);
    const bar = $('bar'), termsInput = $('terms'), typeSelect = $('type'), sinceSelect = $('since'),
        sortSelect = $('sortby'), runBtn = $('run'), presetsEl = $('presets'), legendEl = $('legend'),
        banner = $('banner'), bannerMsg = $('bannerMsg'), retryBtn = $('retry'),
        statsEl = $('stats'), listEl = $('list');

    let termMeta = [];        // [{key, color}] for the terms currently loaded
    const activeTerms = new Set();
    let hits = new Map();     // objectID -> normalized hit
    let requestSeq = 0;       // guards against stale responses when re-run overlaps
    let activeController = null;
    const commentCache = new Map();

    const escapeHtml = (str) => String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    const htmlToText = (html) => {
        const d = document.createElement('div');
        d.innerHTML = html || '';
        return (d.textContent || '').trim();
    };
    const relTime = (unix) => {
        const s = Math.floor(Date.now() / 1000) - unix;
        if (s < 3600) return Math.max(1, Math.floor(s / 60)) + 'm';
        if (s < 86400) return Math.floor(s / 3600) + 'h';
        return Math.floor(s / 86400) + 'd';
    };
    const domainOf = (url) => {
        try {
            return new URL(url).hostname.replace(/^www\./, '');
        } catch {
            return null;
        }
    };
    const parseTerms = (raw) => [...new Set(raw.split(',').map(s => s.trim().toLowerCase()).filter(Boolean))];
    const rowId = (id) => `item-${String(id).replace(/[^a-zA-Z0-9_-]/g, '-')}`;
    const safeUrl = (value, fallback) => {
        try {
            const url = new URL(value || fallback, location.href);
            return ['http:', 'https:'].includes(url.protocol) ? url.href : fallback;
        } catch {
            return fallback;
        }
    };

    function readUrlState() {
        const params = new URLSearchParams(location.search);
        const type = params.get('type');
        const since = params.get('since');
        const sort = params.get('sort');
        return {
            terms: params.get('terms') ?? termsInput.value,
            type: VALID_TYPES.has(type) ? type : typeSelect.value,
            since: VALID_RANGES.has(since) ? since : sinceSelect.value,
            sort: VALID_SORTS.has(sort) ? sort : sortSelect.value,
        };
    }

    function syncUrl({push = false, hash = location.hash} = {}) {
        const url = new URL(location.href);
        url.search = new URLSearchParams({
            terms: parseTerms(termsInput.value).join(', '),
            type: typeSelect.value,
            since: sinceSelect.value,
            sort: sortSelect.value,
        }).toString();
        url.hash = hash || '';
        history[push ? 'pushState' : 'replaceState']({}, '', url);
    }

    function applyUrlState() {
        const state = readUrlState();
        termsInput.value = state.terms;
        typeSelect.value = state.type;
        sinceSelect.value = state.since;
        sortSelect.value = state.sort;
    }

    function focusHashResult() {
        let id;
        try {
            id = decodeURIComponent(location.hash.slice(1));
        } catch {
            return;
        }
        if (!id.startsWith('item-')) return;
        const result = document.getElementById(id);
        if (!result) return;
        result.open = true;
        result.scrollIntoView({behavior: 'smooth', block: 'center'});
    }

    function colorForTerm(key, seenSoFar) {
        if (TERM_COLORS[key]) return TERM_COLORS[key];
        const customIndex = seenSoFar.filter(k => !TERM_COLORS[k]).length;
        return FALLBACK_PALETTE[customIndex % FALLBACK_PALETTE.length];
    }

    function buildPresets() {
        PRESETS.forEach(preset => {
            const b = document.createElement('button');
            b.type = 'button';
            b.textContent = preset.split(',').map(s => s.trim()).join(' + ');
            b.dataset.preset = preset;
            b.addEventListener('click', () => {
                termsInput.value = preset;
                loadAll({push: true});
            });
            presetsEl.appendChild(b);
        });
    }

    function markActivePreset() {
        const current = parseTerms(termsInput.value).join(',');
        presetsEl.querySelectorAll('button').forEach(b => {
            b.classList.toggle('active', parseTerms(b.dataset.preset).join(',') === current);
        });
    }

    function buildLegend() {
        legendEl.innerHTML = '';
        termMeta.forEach(t => {
            const b = document.createElement('button');
            b.type = 'button';
            b.innerHTML = `<span class="dot" style="background:${t.color}"></span>${escapeHtml(t.key)}`;
            b.addEventListener('click', () => {
                activeTerms.has(t.key) ? activeTerms.delete(t.key) : activeTerms.add(t.key);
                b.classList.toggle('off', !activeTerms.has(t.key));
                render();
            });
            legendEl.appendChild(b);
        });
    }

    async function fetchTerm(term, type, sinceTs, signal) {
        // queryType=prefixNone turns off Algolia's default prefix matching (which
        // treats "java" as a prefix of "javascript") so results match HN's own
        // prefix=false behavior instead of flooding with unrelated JS stories.
        const url = new URL('https://hn.algolia.com/api/v1/search');
        url.searchParams.set('query', term);
        url.searchParams.set('queryType', 'prefixNone');
        url.searchParams.set('hitsPerPage', '100');
        if (type !== 'all') url.searchParams.set('tags', type);
        if (sinceTs) url.searchParams.set('numericFilters', `created_at_i>${sinceTs}`);
        const res = await fetch(url, {signal});
        if (!res.ok) throw new Error(`${res.status}`);
        return (await res.json()).hits;
    }

    function normalize(h, matchedTerm) {
        const isComment = (h._tags || []).includes('comment');
        return {
            id: h.objectID,
            isComment,
            title: h.title || h.story_title || null,
            url: h.url || h.story_url || null,
            commentText: h.comment_text || null,
            points: h.points ?? null,
            numComments: h.num_comments ?? null,
            author: h.author || 'unknown',
            created_at_i: h.created_at_i,
            matched: new Set([matchedTerm]),
        };
    }

    async function loadAll({push = false, updateUrl = true, clearHash = true} = {}) {
        const seq = ++requestSeq;
        activeController?.abort();
        const controller = new AbortController();
        activeController = controller;
        const terms = parseTerms(termsInput.value);
        banner.classList.remove('show');
        markActivePreset();

        if (terms.length === 0) {
            runBtn.disabled = false;
            statsEl.textContent = 'enter at least one term.';
            return;
        }
        if (updateUrl) syncUrl({push, hash: clearHash ? '' : location.hash});

        termMeta = [];
        terms.forEach(key => termMeta.push({key, color: colorForTerm(key, terms.slice(0, terms.indexOf(key)))}));
        activeTerms.clear();
        terms.forEach(t => activeTerms.add(t));
        buildLegend();

        runBtn.disabled = true;
        statsEl.textContent = 'fetching…';
        listEl.innerHTML = '';
        hits = new Map();

        const type = typeSelect.value;
        const days = parseInt(sinceSelect.value, 10);
        const sinceTs = days > 0 ? Math.floor(Date.now() / 1000) - days * 86400 : null;

        const outcomes = await Promise.allSettled(terms.map(t => fetchTerm(t, type, sinceTs, controller.signal)));
        if (seq !== requestSeq) return; // a newer search started before this one finished
        activeController = null;

        const failed = [];
        outcomes.forEach((outcome, i) => {
            if (outcome.status === 'rejected') {
                failed.push(terms[i]);
                return;
            }
            outcome.value.forEach(h => {
                const existing = hits.get(h.objectID);
                existing ? existing.matched.add(terms[i]) : hits.set(h.objectID, normalize(h, terms[i]));
            });
        });

        runBtn.disabled = false;
        if (failed.length) showError(failed);
        render();
    }

    function showError(failedTerms) {
        bannerMsg.textContent = failedTerms.length === termMeta.length
            ? "Couldn't reach the HN search API — check your connection and retry."
            : `Couldn't load results for: ${failedTerms.join(', ')} — other terms loaded fine.`;
        banner.classList.add('show');
    }

    function render() {
        const sortby = sortSelect.value;
        const rows = [...hits.values()]
            .filter(s => [...s.matched].some(m => activeTerms.has(m)))
            .sort((a, b) => {
                if (sortby === 'date') return b.created_at_i - a.created_at_i;
                if (sortby === 'comments') return (b.numComments || 0) - (a.numComments || 0);
                return (b.points || 0) - (a.points || 0);
            });

        const perTerm = Object.fromEntries(termMeta.map(t => [t.key, 0]));
        rows.forEach(s => s.matched.forEach(m => {
            if (m in perTerm) perTerm[m]++;
        }));
        const breakdown = termMeta.map(t => `${t.key} ${perTerm[t.key]}`).join(' · ');
        statsEl.textContent = `${rows.length} results — ${breakdown}`;

        listEl.innerHTML = '';
        if (rows.length === 0) {
            const msg = banner.classList.contains('show')
                ? 'no results loaded — see the error above.'
                : 'nothing matched. widen the date range, switch type to "all", or add more terms.';
            listEl.innerHTML = `<p style="font-family:var(--mono);font-size:13px;color:var(--muted);padding:20px 4px;">${msg}</p>`;
            return;
        }
        const fragment = document.createDocumentFragment();
        rows.forEach(s => fragment.appendChild(buildRow(s)));
        listEl.appendChild(fragment);
        focusHashResult();
    }

    const dotColorFor = (s) => termMeta.find(t => s.matched.has(t.key))?.color || '#999';

    function buildRow(s) {
        const det = document.createElement('details');
        det.className = 'row';
        det.id = rowId(s.id);
        const hnUrl = new URL('https://news.ycombinator.com/item');
        hnUrl.searchParams.set('id', String(s.id));
        const userUrl = new URL('https://news.ycombinator.com/user');
        userUrl.searchParams.set('id', s.author);
        const permalink = new URL(location.href);
        permalink.hash = det.id;
        const resultUrl = escapeHtml(permalink.href);

        let titleHtml, snippetHtml = '';
        if (s.isComment) {
            const text = htmlToText(s.commentText);
            titleHtml = `<span class="kind">comment on</span> <a class="storylink" href="${escapeHtml(hnUrl.href)}" target="_blank" rel="noopener">${escapeHtml(s.title || 'untitled thread')}</a>`;
            snippetHtml = `<div class="snippet">${escapeHtml(text.length > 220 ? text.slice(0, 220) + '…' : text)}</div>`;
        } else {
            const dom = domainOf(s.url);
            titleHtml = `<a class="storylink" href="${escapeHtml(safeUrl(s.url, hnUrl))}" target="_blank" rel="noopener">${escapeHtml(s.title || 'untitled')}</a>` +
                (dom ? ` <span class="domain">(${escapeHtml(dom)})</span>` : '');
        }

        const metaParts = [];
        if (s.points !== null) metaParts.push(`<a href="${escapeHtml(hnUrl.href)}" target="_blank" rel="noopener">${s.points} points</a>`);
        metaParts.push(`<a href="${escapeHtml(userUrl.href)}" target="_blank" rel="noopener">${escapeHtml(s.author)}</a>`);
        metaParts.push(`${relTime(s.created_at_i)} ago`);
        if (s.numComments !== null) metaParts.push(`<a href="${escapeHtml(hnUrl.href)}" target="_blank" rel="noopener">${s.numComments} comments</a>`);
        metaParts.push(`<a class="permalink" href="${resultUrl}" aria-label="link to this result">#</a>`);

        det.innerHTML = `
    <summary>
      <span class="row-dot" style="background:${dotColorFor(s)}"></span>
      <span class="row-body">
        <div class="title-line">${titleHtml}</div>
        ${snippetHtml}
        <div class="meta">${metaParts.join('<span class="sep">·</span>')}</div>
      </span>
      <span class="expand-caret">▸</span>
    </summary>
    <div class="comments"><div class="loading">not loaded yet</div></div>
  `;

        const commentsBox = det.querySelector('.comments');
        det.querySelector('.permalink').addEventListener('click', (event) => event.stopPropagation());
        let loaded = false;
        det.addEventListener('toggle', async () => {
            det.querySelector('.expand-caret').textContent = det.open ? '▾' : '▸';
            if (!det.open || loaded) return;
            loaded = true;

            if (s.isComment) {
                const commentHtml = `<div class="comment"><div class="ctext">${escapeHtml(htmlToText(s.commentText))}</div></div>
        <a class="viewall" href="${escapeHtml(hnUrl.href)}" target="_blank" rel="noopener">view thread on HN →</a>`;
                commentsBox.innerHTML = commentHtml;
                return;
            }

            const cached = commentCache.get(s.id);
            if (cached) {
                commentsBox.innerHTML = cached;
                return;
            }

            commentsBox.innerHTML = '<div class="loading">loading comments…</div>';
            try {
                const res = await fetch(`https://hn.algolia.com/api/v1/items/${s.id}`);
                if (!res.ok) throw new Error(`${res.status}`);
                const data = await res.json();
                const top = (data.children || []).filter(c => c?.text).slice(0, 3);
                const commentHtml = top.length === 0
                    ? '<div class="empty">no comments yet.</div>'
                    : top.map(c => {
                    const text = htmlToText(c.text);
                    return `<div class="comment"><div class="cauthor">${escapeHtml(c.author || 'unknown')}</div><div class="ctext">${escapeHtml(text.length > 320 ? text.slice(0, 320) + '…' : text)}</div></div>`;
                }).join('') + `<a class="viewall" href="${escapeHtml(hnUrl.href)}" target="_blank" rel="noopener">view all ${s.numComments ?? ''} comments on HN →</a>`;
                commentCache.set(s.id, commentHtml);
                commentsBox.innerHTML = commentHtml;
            } catch {
                commentsBox.innerHTML = `<div class="empty">couldn't load comments. <a href="${escapeHtml(hnUrl.href)}" target="_blank" rel="noopener">open on HN</a></div>`;
            }
        });

        return det;
    }

    bar.addEventListener('submit', (e) => {
        e.preventDefault();
        loadAll({push: true});
    });
    typeSelect.addEventListener('change', () => loadAll({push: true}));
    sinceSelect.addEventListener('change', () => loadAll({push: true}));
    sortSelect.addEventListener('change', () => {
        syncUrl({push: true});
        render();
    });
    retryBtn.addEventListener('click', () => loadAll({clearHash: false}));
    window.addEventListener('popstate', () => {
        applyUrlState();
        loadAll({updateUrl: false, clearHash: false});
    });
    window.addEventListener('hashchange', focusHashResult);
    buildPresets();
    applyUrlState();
    loadAll({updateUrl: true, clearHash: false});
</script>
</body>
</html>
